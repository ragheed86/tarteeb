name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # متغيرات وهمية فقط لإتمام البناء (لا اتصال فعلي بأي Supabase) — لا أسرار حقيقية هنا.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # بلا SUPABASE_SERVICE_ROLE_KEY/PW_TEST_EMAIL (أسرار غير مُعرَّفة هنا): اختبارات
      # smoke.spec.js وscreens.spec.js المصادَقة تتخطى نفسها تلقائياً (auth.setup.js)،
      # بينما security.spec.js تُشغَّل فعلياً وتتحقق من رؤوس الأمان ورفض المسارات الحساسة.
      - run: npx playwright test --project=desktop
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migration-smoke:
    name: Migration smoke (local Supabase stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # يشغّل Postgres + Auth + كل خدمات Supabase محلياً عبر Docker داخل المُشغِّل
      # (مجاني بالكامل، بلا أي مشروع سحابي)، ويطبّق supabase/migrations/*.sql تلقائياً.
      # هذا يثبت أن الهجرات تُطبَّق بنجاح على مخطط Supabase الحقيقي (auth, roles, RLS)
      # لا على Postgres عادي ينقصه auth schema والأدوار.
      - run: supabase start
      - run: supabase db reset --local
      - name: إيقاف الحاوية
        if: always()
        run: supabase stop --no-backup

  dependency-audit:
    name: Dependency audit (تقرير فقط — لا يمنع الدمج حالياً)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
